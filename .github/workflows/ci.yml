name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Python 3.10, oldest pandas and PySpark
            python-version: "3.10"
            extras: spark,dev
            pins: '"pandas==2.0.*" "numpy<2" "pyspark==3.5.*"'
          - name: Python 3.13, latest pandas and PySpark
            python-version: "3.13"
            extras: spark,dev
          - name: Python 3.13, without PySpark
            python-version: "3.13"
            extras: dev
    env:
      # fail instead of skipping Spark tests when PySpark is expected to be installed
      REQUIRE_SPARK: ${{ contains(matrix.extras, 'spark') && '1' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - if: contains(matrix.extras, 'spark')
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -e ".[${{ matrix.extras }}]" ${{ matrix.pins }}
      - run: pytest
